<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIGH MFS TV — Birthday Broadcast</title>
<link rel="stylesheet" href="css/style.css">

<body class="desktop">
<div id="tv-loading" role="status">
  <div class="tv-loading-screen">
    <strong>HIGH MFS TV</strong>
    <span>Memuat ruangan 3D…</span>
    <progress aria-label="Memuat ruangan 3D"></progress>
  </div>
</div>
<script>
  setTimeout(() => document.getElementById('tv-loading')?.remove(), 15000);
</script>
<noscript><style>#tv-loading { display: none; }</style></noscript>
<header>
<b>HIGH MFS ✳</b>
<span>FRIENDS NETWORK</span>
</header>
<main>
<h1>HIGH MFS <i>TV</i>
</h1>
<div class="console">
<section class="tv">
<div class="screen">
<div class="poster">
<small id="tag">★ BIRTHDAY BROADCAST ★</small>
<strong id="headline">Bintang<br>Hari Ini!</strong>
</div>
<video controls playsinline hidden>
</video>
</div>
<div class="stage3d" role="img" aria-label="Ruangan 3D HIGH MFS TV">
</div>
<div class="strip">
<span id="station" aria-live="polite">● STANDBY</span>
<span id="roomHint">
</span>
</div>
</section>
<section class="remote">
<h2>REMOTE CONTROL</h2>
<button class="wide" id="power">⏻ Nyalakan TV</button>
<div class="row">
<button id="prev">CH −</button>
<button id="next">CH +</button>
</div>
<button class="wide" id="tv-fullscreen" type="button">⛶ Fullscreen video</button>
<p id="fullscreen-note" role="status" hidden>
</p>
<button class="wide" id="guide">☷ List Video</button>
</section>
</div>
<label class="upload">＋ Tambah video teman<input type="file" accept="video/*" multiple>
</label>
<p class="note">Pilih beberapa video sekaligus. Video diputar dari perangkatmu dan tersedia selama halaman ini terbuka.</p>

</main>
<footer>
<span>HIGH MFS TV</span>
<span>✳ EDISI ULANG TAHUN</span>
</footer>
<dialog>
<h2>List Video</h2>
<div id="list">
</div>
<button id="close">Tutup</button>
</dialog>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script src="js/supabase-config.js"></script>
<script src="js/video.js">
</script>

<script src="js/desktop.js">
</script>
<script src="js/remote.js">
</script>
<script src="js/kartu-pos.js">
</script>
<script>
if (location.protocol === 'file:') document.write('<script src="js/aset-lokal.js"><'+'/script>');
</script>
<script src="js/kiriman.js"></script>
<script src="js/ruangan.js">
</script>
</html>
